  <text x="200" y="175" font-family="serif" font-size="60" fill="#C9A84C" text-anchor="middle" opacity="0.6">G</text>
  <text x="200" y="300" font-family="serif" font-size="18" fill="#8B0000" text-anchor="middle" opacity="0.5">Ajith - Groom's Photo</text>
